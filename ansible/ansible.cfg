# Config do Ansible. Basta existir na pasta de onde voce roda o ansible-playbook
# que ele e lido automaticamente (resolve o "config file = None" do --version).
# ATENCAO: em arquivo .cfg/.ini o comentario tem que ficar em LINHA PROPRIA --
# comentario no fim da linha do valor vira parte do valor e quebra tudo.
[defaults]
inventory = inventory.ini
