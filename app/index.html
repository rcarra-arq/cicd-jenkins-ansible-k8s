<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CI/CD Pipeline Lab — Jenkins · Ansible · Kubernetes</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 40px;
      background: #111827;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
      color: #cbd5e1;
    }

    .badge {
      display: inline-block;
      margin-top: 15px;
      padding: 6px 12px;
      background: #1e293b;
      border-radius: 20px;
      font-size: 12px;
      color: #38bdf8;
    }

    .version {
      margin-top: 25px;
      font-size: 28px;
      font-weight: bold;
      color: #4ade80;
    }

    .tech {
      margin-top: 12px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>CI/CD Pipeline Lab</h1>

    <p>
      A local, zero-cloud-cost CI/CD pipeline: an application built into a
      container, provisioned with Ansible, and deployed to Kubernetes by a
      Jenkins pipeline. Reuses the app from cloud-monitoring-lab.
    </p>

    <div class="badge">Jenkins • Ansible • Kubernetes • Docker</div>

    <div class="version">version v2</div>
    <p class="tech">running on Kubernetes</p>
  </div>
</body>
</html>
